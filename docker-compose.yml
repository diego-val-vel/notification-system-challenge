services:
  backend:
    container_name: notification-system-backend
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: tail -f /dev/null
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: notifications_db
      DB_USER: notifications_user
      DB_PASSWORD: notifications_password
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    container_name: notification-system-frontend
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "tail -f /dev/null"
    ports:
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    volumes:
      - ./frontend:/workspace

  db:
    image: postgres:16-alpine
    container_name: notification-system-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: notifications_user
      POSTGRES_PASSWORD: notifications_password
    ports:
      - "5432:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

volumes:
  notification_postgres_data:
